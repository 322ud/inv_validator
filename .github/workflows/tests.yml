name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag to publish (for example v0.5.4)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  source:
    name: Resolve source and release tag
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.commit.outputs.ref }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - name: Select release source
        id: source
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          tag=""
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            tag="$REQUESTED_TAG"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/release/v* ]]; then
            tag="${GITHUB_REF#refs/heads/release/}"
          fi
          if [[ -n "$tag" ]]; then
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid release tag: $tag" >&2
              exit 1
            fi
            echo "ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.ref }}
      - name: Pin source commit and verify release version
        id: commit
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
        run: |
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [[ -n "$RELEASE_TAG" ]]; then
            version="$(sed -n 's:.*<version>\([^<]*\)</version>.*:\1:p' appinfo/info.xml)"
            test "$RELEASE_TAG" = "v$version"
          fi

  php:
    needs: source
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.ref }}
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: dom, libxml, mbstring, xml, zip
          tools: composer:v2
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Check PHP code style
        run: composer lint
      - name: Run PHPStan
        run: composer analyse
      - name: Run PHP tests
        run: composer test

  javascript:
    needs: source
    name: JavaScript (Node.js 22)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Run JavaScript tests
        run: npm test

  nextcloud:
    needs: source
    name: Nextcloud 34 integration
    runs-on: ubuntu-latest
    env:
      NEXTCLOUD_VERSION: 34.0.5
      KOSIT_VALIDATOR_VERSION: 1.6.2
      KOSIT_CONFIGURATION_VERSION: 2026-01-31

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.ref }}
      - name: Define temporary paths
        run: |
          echo "NEXTCLOUD_ROOT=$RUNNER_TEMP/nextcloud-integration" >> "$GITHUB_ENV"
          echo "KOSIT_ASSET_DIRECTORY=$RUNNER_TEMP/kosit-smoke-assets" >> "$GITHUB_ENV"
          echo "KOSIT_REPOSITORY=$RUNNER_TEMP/kosit-xrechnung-configuration" >> "$GITHUB_ENV"
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: apcu, bz2, curl, dom, fileinfo, gd, intl, libxml, mbstring, pdo_sqlite, posix, session, simplexml, sqlite3, xml, xmlreader, xmlwriter, zip
          tools: composer:v2
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install app dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Cache Nextcloud release
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/nextcloud-${{ env.NEXTCLOUD_VERSION }}.tar.bz2
          key: nextcloud-${{ env.NEXTCLOUD_VERSION }}-release
      - name: Download and verify Nextcloud
        working-directory: ${{ runner.temp }}
        run: |
          archive="nextcloud-${NEXTCLOUD_VERSION}.tar.bz2"
          if [ ! -f "$archive" ]; then
            curl --fail --silent --show-error --location \
              "https://download.nextcloud.com/server/releases/$archive" \
              --output "$archive"
          fi
          curl --fail --silent --show-error --location \
            "https://download.nextcloud.com/server/releases/$archive.sha256" \
            | head -n 1 \
            | sha256sum --check --strict -
      - name: Install Nextcloud and enable app
        run: |
          mkdir "$NEXTCLOUD_ROOT"
          tar --extract --bzip2 \
            --file "${{ runner.temp }}/nextcloud-${NEXTCLOUD_VERSION}.tar.bz2" \
            --directory "$NEXTCLOUD_ROOT" \
            --strip-components=1
          cp --archive "$GITHUB_WORKSPACE" "$NEXTCLOUD_ROOT/apps/kosit_validator"
          cd "$NEXTCLOUD_ROOT"
          php occ maintenance:install \
            --database sqlite \
            --admin-user admin \
            --admin-pass integration-test-password
          OC_PASS=integration-user-password php occ user:add \
            --password-from-env \
            --display-name='Integration User' \
            integration-user
          php occ app:disable firstrunwizard
          php occ app:enable kosit_validator
          app_version="$(sed -n 's:.*<version>\([^<]*\)</version>.*:\1:p' "$GITHUB_WORKSPACE/appinfo/info.xml")"
          php occ app:list --enabled | grep --fixed-strings --line-regexp "  - kosit_validator: $app_version"
      - name: Run Nextcloud framework integration tests
        run: |
          "$NEXTCLOUD_ROOT/apps/kosit_validator/vendor/bin/phpunit" \
            --configuration "$NEXTCLOUD_ROOT/apps/kosit_validator/tests/Nextcloud/phpunit.xml"
      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Cache KoSIT browser test assets
        uses: actions/cache@v6
        with:
          path: ${{ env.KOSIT_ASSET_DIRECTORY }}
          key: kosit-${{ env.KOSIT_VALIDATOR_VERSION }}-xrechnung-${{ env.KOSIT_CONFIGURATION_VERSION }}-smoke-assets-v1
      - name: Prepare real KoSIT validator for Nextcloud
        run: |
          bash tests/EndToEnd/download-kosit-assets.sh
          mkdir --parents "$KOSIT_REPOSITORY"
          unzip -q \
            "$KOSIT_ASSET_DIRECTORY/xrechnung-3.0.2-validator-configuration-${KOSIT_CONFIGURATION_VERSION}.zip" \
            -d "$KOSIT_REPOSITORY"
          mkdir --parents "$NEXTCLOUD_ROOT/data/kosit-validator-temp"
          cd "$NEXTCLOUD_ROOT"
          php occ config:system:set trusted_domains 1 --value=127.0.0.1:8080
          php occ config:app:set kosit_validator java_binary --value="$JAVA_HOME/bin/java"
          php occ config:system:set kosit_validator_jar \
            --value="$KOSIT_ASSET_DIRECTORY/validator-${KOSIT_VALIDATOR_VERSION}-standalone.jar"
          php occ config:system:set kosit_validator_repository --value="$KOSIT_REPOSITORY"
          php occ config:system:set kosit_validator_temp_directory \
            --value="$NEXTCLOUD_ROOT/data/kosit-validator-temp"
      - name: Run browser end-to-end test
        env:
          KOSIT_VALID_INVOICE: ${{ env.KOSIT_ASSET_DIRECTORY }}/01.01a-INVOICE_ubl.xml
        run: npm run test:browser
      - name: Upload Playwright diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  kosit:
    needs: source
    name: KoSIT end-to-end smoke test
    runs-on: ubuntu-latest
    env:
      KOSIT_VALIDATOR_VERSION: 1.6.2
      KOSIT_CONFIGURATION_VERSION: 2026-01-31

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.ref }}
      - name: Define temporary paths
        run: |
          echo "KOSIT_ASSET_DIRECTORY=$RUNNER_TEMP/kosit-smoke-assets" >> "$GITHUB_ENV"
          echo "KOSIT_REPOSITORY=$RUNNER_TEMP/kosit-xrechnung-configuration" >> "$GITHUB_ENV"
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: dom, libxml, mbstring, xml, zip
          tools: composer:v2
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Cache KoSIT test assets
        uses: actions/cache@v6
        with:
          path: ${{ env.KOSIT_ASSET_DIRECTORY }}
          key: kosit-${{ env.KOSIT_VALIDATOR_VERSION }}-xrechnung-${{ env.KOSIT_CONFIGURATION_VERSION }}-smoke-assets-v1
      - name: Download and verify KoSIT test assets
        run: bash tests/EndToEnd/download-kosit-assets.sh
      - name: Extract XRechnung configuration
        run: |
          mkdir --parents "$KOSIT_REPOSITORY"
          unzip -q \
            "$KOSIT_ASSET_DIRECTORY/xrechnung-3.0.2-validator-configuration-${KOSIT_CONFIGURATION_VERSION}.zip" \
            -d "$KOSIT_REPOSITORY"
      - name: Run real KoSIT validation
        env:
          KOSIT_VALIDATOR_JAR: ${{ env.KOSIT_ASSET_DIRECTORY }}/validator-1.6.2-standalone.jar
          KOSIT_SCENARIO_FILE: ${{ env.KOSIT_REPOSITORY }}/scenarios.xml
          KOSIT_VALID_INVOICE: ${{ env.KOSIT_ASSET_DIRECTORY }}/01.01a-INVOICE_ubl.xml
        run: |
          export KOSIT_JAVA_BINARY="$JAVA_HOME/bin/java"
          vendor/bin/phpunit --configuration tests/EndToEnd/phpunit.xml

  release-package:
    name: Production release package
    runs-on: ubuntu-latest
    needs: [source, php, javascript, nextcloud, kosit]
    outputs:
      name: ${{ steps.package.outputs.name }}
      version: ${{ steps.package.outputs.version }}
    env:
      NEXTCLOUD_VERSION: 34.0.5

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.ref }}
      - name: Define temporary paths
        run: |
          echo "NEXTCLOUD_PACKAGE_ROOT=$RUNNER_TEMP/nextcloud-package-test" >> "$GITHUB_ENV"
          echo "NEXTCLOUD_OCC=$RUNNER_TEMP/nextcloud-package-test/occ" >> "$GITHUB_ENV"
          echo "APP_SIGNING_DIRECTORY=$RUNNER_TEMP/app-signing" >> "$GITHUB_ENV"
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: apcu, bz2, curl, dom, fileinfo, gd, intl, libxml, mbstring, pdo_sqlite, posix, session, simplexml, sqlite3, xml, xmlreader, xmlwriter, zip
          tools: composer:v2
      - name: Install test dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Set up signing tools
        run: |
          if ! command -v openssl >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes openssl
          fi
          command -v openssl
          openssl version
      - name: Cache Nextcloud release
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/nextcloud-${{ env.NEXTCLOUD_VERSION }}.tar.bz2
          key: nextcloud-${{ env.NEXTCLOUD_VERSION }}-release
      - name: Download and verify Nextcloud
        working-directory: ${{ runner.temp }}
        run: |
          archive="nextcloud-${NEXTCLOUD_VERSION}.tar.bz2"
          if [ ! -f "$archive" ]; then
            curl --fail --silent --show-error --location \
              "https://download.nextcloud.com/server/releases/$archive" \
              --output "$archive"
          fi
          curl --fail --silent --show-error --location \
            "https://download.nextcloud.com/server/releases/$archive.sha256" \
            | head -n 1 \
            | sha256sum --check --strict -
      - name: Initialize isolated Nextcloud for signing and package tests
        run: |
          mkdir "$NEXTCLOUD_PACKAGE_ROOT"
          tar --extract --bzip2 \
            --file "${{ runner.temp }}/nextcloud-${NEXTCLOUD_VERSION}.tar.bz2" \
            --directory "$NEXTCLOUD_PACKAGE_ROOT" \
            --strip-components=1
          cd "$NEXTCLOUD_PACKAGE_ROOT"
          php occ maintenance:install \
            --database sqlite \
            --admin-user package-admin \
            --admin-pass package-test-password
      - name: Test release signing contract
        run: vendor/bin/phpunit --bootstrap tests/bootstrap.php tests/Build
      - name: Prepare release signing credentials
        if: needs.source.outputs.tag != ''
        env:
          SIGNING_KEY_PEM: ${{ secrets.APP_SIGNING_PRIVATE_KEY }}
          SIGNING_CERTIFICATE_PEM: ${{ secrets.APP_SIGNING_CERTIFICATE }}
        run: |
          if [[ -z "$SIGNING_KEY_PEM" || -z "$SIGNING_CERTIFICATE_PEM" ]]; then
            echo 'Releases require APP_SIGNING_PRIVATE_KEY and APP_SIGNING_CERTIFICATE secrets.' >&2
            exit 1
          fi
          umask 077
          mkdir --mode=0700 "$APP_SIGNING_DIRECTORY"
          printf '%s\n' "$SIGNING_KEY_PEM" > "$APP_SIGNING_DIRECTORY/app.key"
          printf '%s\n' "$SIGNING_CERTIFICATE_PEM" > "$APP_SIGNING_DIRECTORY/app.crt"
          echo "APP_SIGNING_KEY_FILE=$APP_SIGNING_DIRECTORY/app.key" >> "$GITHUB_ENV"
          echo "APP_SIGNING_CERTIFICATE_FILE=$APP_SIGNING_DIRECTORY/app.crt" >> "$GITHUB_ENV"
      - name: Build reproducible app package
        id: package
        env:
          APP_REQUIRE_SIGNING: ${{ needs.source.outputs.tag != '' && '1' || '0' }}
        run: |
          archive="$(bash scripts/build-release.sh)"
          comparison_archive="$(bash scripts/build-release.sh "${{ runner.temp }}/release-reproducibility-check")"
          cmp "$archive" "$comparison_archive"
          if [[ "$APP_REQUIRE_SIGNING" == 1 ]]; then
            for suffix in .sig .sig.b64 .crt; do
              cmp "$archive$suffix" "$comparison_archive$suffix"
            done
          fi
          filename="$(basename "$archive")"
          version="${filename#kosit_validator-}"
          version="${version%.tar.gz}"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "checksum=$archive.sha256" >> "$GITHUB_OUTPUT"
          echo "name=${filename%.tar.gz}" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Remove temporary signing credentials
        if: always()
        run: |
          if [[ -n "${APP_SIGNING_DIRECTORY:-}" ]]; then
            rm --force -- "$APP_SIGNING_DIRECTORY/app.key" "$APP_SIGNING_DIRECTORY/app.crt"
          fi
      - name: Verify archive structure
        run: |
          archive="${{ steps.package.outputs.archive }}"
          php tests/Release/check-archive-format.php "$archive"
          tar --list --gzip --file "$archive" \
            | while IFS= read -r entry; do
                case "$entry" in
                  kosit_validator|kosit_validator/*) ;;
                  *) echo "Unexpected archive entry: $entry" >&2; exit 1 ;;
                esac
              done
          tar --list --gzip --file "$archive" \
            | grep --fixed-strings --line-regexp 'kosit_validator/appinfo/info.xml'
          if tar --list --gzip --file "$archive" \
            | grep --extended-regexp '(^|/)(\.git|\.github|composer\.(json|lock)|node_modules|package(-lock)?\.json|tests|vendor)(/|$)'; then
            echo 'Development files found in release archive' >&2
            exit 1
          fi
          cd "$(dirname "$archive")"
          sha256sum --check --strict "$(basename "$archive").sha256"
      - name: Install package in a fresh Nextcloud
        env:
          APP_REQUIRE_SIGNING: ${{ needs.source.outputs.tag != '' && '1' || '0' }}
        run: |
          tar --extract --gzip \
            --file "${{ steps.package.outputs.archive }}" \
            --directory "$NEXTCLOUD_PACKAGE_ROOT/apps"
          cd "$NEXTCLOUD_PACKAGE_ROOT"
          if [[ "$APP_REQUIRE_SIGNING" == 1 ]]; then
            test -s apps/kosit_validator/appinfo/signature.json
            php occ integrity:check-app kosit_validator
          fi
          php occ app:enable kosit_validator
          php occ app:list --enabled \
            | grep --fixed-strings --line-regexp \
              '  - kosit_validator: ${{ steps.package.outputs.version }}'
      - name: Run installed-package smoke tests
        env:
          EXPECTED_APP_VERSION: ${{ steps.package.outputs.version }}
        run: vendor/bin/phpunit --configuration tests/Release/phpunit.xml
      - name: Upload tested release package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
            ${{ steps.package.outputs.archive }}.sig
            ${{ steps.package.outputs.archive }}.sig.b64
            ${{ steps.package.outputs.archive }}.crt
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish tested release package
    needs: [source, release-package]
    if: needs.source.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-${{ needs.source.outputs.tag }}
      cancel-in-progress: false
    steps:
      - name: Download tested release package
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.release-package.outputs.name }}
          path: release-assets
      - name: Set up archive signature verification
        run: |
          if ! command -v openssl >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes openssl
          fi
          command -v openssl
      - name: Verify downloaded checksum
        working-directory: release-assets
        env:
          APP_VERSION: ${{ needs.release-package.outputs.version }}
        run: sha256sum --check --strict "kosit_validator-$APP_VERSION.tar.gz.sha256"
      - name: Verify downloaded archive signature
        working-directory: release-assets
        env:
          APP_VERSION: ${{ needs.release-package.outputs.version }}
        run: |
          archive="kosit_validator-$APP_VERSION.tar.gz"
          openssl x509 -in "$archive.crt" -pubkey -noout > "$RUNNER_TEMP/release-public.pem"
          openssl base64 -d -A -in "$archive.sig.b64" -out "$RUNNER_TEMP/release-signature"
          cmp "$archive.sig" "$RUNNER_TEMP/release-signature"
          openssl dgst -sha512 -verify "$RUNNER_TEMP/release-public.pem" -signature "$archive.sig" "$archive"
      - name: Publish GitHub release with package, signatures and checksum
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          APP_VERSION: ${{ needs.release-package.outputs.version }}
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const repo = context.repo;
            const tag = process.env.RELEASE_TAG;
            const version = process.env.APP_VERSION;
            if (tag !== `v${version}`) throw new Error('Release tag and package version differ');
            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({ ...repo, tag }));
            } catch (error) {
              if (error.status !== 404) throw error;
              ({ data: release } = await github.rest.repos.createRelease({
                ...repo, tag_name: tag, name: tag, draft: true,
                body: 'Signiertes Produktionspaket im USTAR-Format mit SHA-256-Prüfsummen, öffentlichem Zertifikat und SHA-512-Archivsignatur (binär und Base64). Alle Anhänge herunterladen und mit `sha256sum --check kosit_validator-' + version + '.tar.gz.sha256` prüfen.'
              }));
            }
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              ...repo, release_id: release.id
            });
            for (const suffix of ['', '.sha256', '.sig', '.sig.b64', '.crt']) {
              const name = `kosit_validator-${version}.tar.gz${suffix}`;
              const data = fs.readFileSync(`release-assets/${name}`);
              const digest = 'sha256:' + crypto.createHash('sha256').update(data).digest('hex');
              const existing = assets.find(asset => asset.name === name);
              if (existing) {
                if (existing.digest !== digest) throw new Error(`Existing release asset differs: ${name}`);
                continue;
              }
              await github.rest.repos.uploadReleaseAsset({
                ...repo, release_id: release.id, name, data,
                headers: { 'content-type': name.endsWith('.gz') ? 'application/gzip' : (name.endsWith('.sig') ? 'application/octet-stream' : 'text/plain') }
              });
            }
            if (release.draft) {
              await github.rest.repos.updateRelease({ ...repo, release_id: release.id, draft: false });
            }
            core.info(`Published ${release.html_url}`);
