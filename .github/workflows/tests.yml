name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: dom, libxml, mbstring, xml, zip
          tools: composer:v2
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Check PHP code style
        run: composer lint
      - name: Run PHPStan
        run: composer analyse
      - name: Run PHP tests
        run: composer test

  javascript:
    name: JavaScript (Node.js 22)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Run JavaScript tests
        run: npm test

  nextcloud:
    name: Nextcloud 34 integration
    runs-on: ubuntu-latest
    env:
      NEXTCLOUD_VERSION: 34.0.2
      NEXTCLOUD_ROOT: ${{ runner.temp }}/nextcloud-integration

    steps:
      - uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: apcu, bz2, curl, dom, fileinfo, gd, intl, libxml, mbstring, pdo_sqlite, posix, session, simplexml, sqlite3, xml, xmlreader, xmlwriter, zip
          tools: composer:v2
      - name: Install app dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Cache Nextcloud release
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/nextcloud-${{ env.NEXTCLOUD_VERSION }}.tar.bz2
          key: nextcloud-${{ env.NEXTCLOUD_VERSION }}-release
      - name: Download and verify Nextcloud
        working-directory: ${{ runner.temp }}
        run: |
          archive="nextcloud-${NEXTCLOUD_VERSION}.tar.bz2"
          if [ ! -f "$archive" ]; then
            curl --fail --silent --show-error --location \
              "https://download.nextcloud.com/server/releases/$archive" \
              --output "$archive"
          fi
          curl --fail --silent --show-error --location \
            "https://download.nextcloud.com/server/releases/$archive.sha256" \
            | head -n 1 \
            | sha256sum --check --strict -
      - name: Install Nextcloud and enable app
        run: |
          mkdir "$NEXTCLOUD_ROOT"
          tar --extract --bzip2 \
            --file "${{ runner.temp }}/nextcloud-${NEXTCLOUD_VERSION}.tar.bz2" \
            --directory "$NEXTCLOUD_ROOT" \
            --strip-components=1
          cp --archive "$GITHUB_WORKSPACE" "$NEXTCLOUD_ROOT/apps/kosit_validator"
          cd "$NEXTCLOUD_ROOT"
          php occ maintenance:install \
            --database sqlite \
            --admin-user admin \
            --admin-pass integration-test-password
          php occ app:enable kosit_validator
          php occ app:list --enabled | grep --fixed-strings --line-regexp '  - kosit_validator: 0.4.1'
      - name: Run Nextcloud framework integration tests
        run: |
          "$NEXTCLOUD_ROOT/apps/kosit_validator/vendor/bin/phpunit" \
            --configuration "$NEXTCLOUD_ROOT/apps/kosit_validator/tests/Nextcloud/phpunit.xml"

  kosit:
    name: KoSIT end-to-end smoke test
    runs-on: ubuntu-latest
    env:
      KOSIT_ASSET_DIRECTORY: ${{ runner.temp }}/kosit-smoke-assets
      KOSIT_REPOSITORY: ${{ runner.temp }}/kosit-xrechnung-configuration
      KOSIT_VALIDATOR_VERSION: 1.6.2
      KOSIT_CONFIGURATION_VERSION: 2026-01-31

    steps:
      - uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: dom, libxml, mbstring, xml, zip
          tools: composer:v2
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Cache KoSIT test assets
        uses: actions/cache@v6
        with:
          path: ${{ env.KOSIT_ASSET_DIRECTORY }}
          key: kosit-${{ env.KOSIT_VALIDATOR_VERSION }}-xrechnung-${{ env.KOSIT_CONFIGURATION_VERSION }}-smoke-assets-v1
      - name: Download and verify KoSIT test assets
        run: |
          mkdir --parents "$KOSIT_ASSET_DIRECTORY"
          cd "$KOSIT_ASSET_DIRECTORY"

          validator="validator-${KOSIT_VALIDATOR_VERSION}-standalone.jar"
          configuration="xrechnung-3.0.2-validator-configuration-${KOSIT_CONFIGURATION_VERSION}.zip"
          invoice="01.01a-INVOICE_ubl.xml"

          if [ ! -f "$validator" ]; then
            curl --fail --silent --show-error --location \
              "https://github.com/itplr-kosit/validator/releases/download/v${KOSIT_VALIDATOR_VERSION}/$validator" \
              --output "$validator"
          fi
          if [ ! -f "$configuration" ]; then
            curl --fail --silent --show-error --location \
              "https://github.com/itplr-kosit/validator-configuration-xrechnung/releases/download/v${KOSIT_CONFIGURATION_VERSION}/$configuration" \
              --output "$configuration"
          fi
          if [ ! -f "$invoice" ]; then
            curl --fail --silent --show-error --location \
              "https://projekte.kosit.org/xrechnung/xrechnung-testsuite/-/raw/33cf3bdf13fb0d8443c51371ab892f25a9468d79/src/test/business-cases/standard/$invoice" \
              --output "$invoice"
          fi

          echo '244978514ad48f67c7573acfffc8f4fd73d81feda6f276710033f9913579857e  validator-1.6.2-standalone.jar' | sha256sum --check --strict -
          echo '6a5a5911a421b25fbc423f62f93f894df7b236f5d73ca4f84bb222a945082704  xrechnung-3.0.2-validator-configuration-2026-01-31.zip' | sha256sum --check --strict -
          echo '74fb09c609d5fba15a8c543060998d3b92858f56a81fb5b0ed244d6794e498d1  01.01a-INVOICE_ubl.xml' | sha256sum --check --strict -
      - name: Extract XRechnung configuration
        run: |
          mkdir --parents "$KOSIT_REPOSITORY"
          unzip -q \
            "$KOSIT_ASSET_DIRECTORY/xrechnung-3.0.2-validator-configuration-${KOSIT_CONFIGURATION_VERSION}.zip" \
            -d "$KOSIT_REPOSITORY"
      - name: Run real KoSIT validation
        env:
          KOSIT_VALIDATOR_JAR: ${{ env.KOSIT_ASSET_DIRECTORY }}/validator-1.6.2-standalone.jar
          KOSIT_SCENARIO_FILE: ${{ github.workspace }}/config/EN16931_(CII)-szenario.xml
          KOSIT_VALID_INVOICE: ${{ env.KOSIT_ASSET_DIRECTORY }}/01.01a-INVOICE_ubl.xml
        run: |
          export KOSIT_JAVA_BINARY="$JAVA_HOME/bin/java"
          vendor/bin/phpunit --configuration tests/EndToEnd/phpunit.xml
